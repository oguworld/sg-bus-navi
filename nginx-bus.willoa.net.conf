# bus.willoa.net 用 nginx serverブロック（下書き）
#
# 適用手順（DNSのAレコードが 194.233.82.43 に伝播した後に実施すること）:
#   1. sudo cp nginx-bus.willoa.net.conf /etc/nginx/sites-available/bus.willoa.net
#   2. sudo certbot --nginx -d bus.willoa.net   （SSL証明書を新規取得。DNS未伝播だと失敗する）
#      → certbotが自動で以下のSSLブロックを追記・調整することが多いので、
#        先に下記のHTTPブロックのみで --nginx を実行するのが確実
#   3. sudo ln -s /etc/nginx/sites-available/bus.willoa.net /etc/nginx/sites-enabled/
#   4. sudo nginx -t   （構文チェック、エラーがないことを確認）
#   5. sudo systemctl reload nginx
#
# 注意: 他サイト（dosuru.app: 3000番, willoa.net: 3001番）と共有のnginxを操作するため、
# 必ず `nginx -t` で構文検証してから reload すること。

server {
    listen 80;
    server_name bus.willoa.net;

    location / {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

