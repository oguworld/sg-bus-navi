name: iOS Deploy to App Store

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: |
          cd ios-app
          npm install

      - name: Add iOS platform
        run: |
          cd ios-app
          npx cap add ios

      - name: Generate app icons and splash screen
        run: |
          cd ios-app
          npx capacitor-assets generate --ios

      - name: Sync Capacitor
        run: |
          cd ios-app
          npx cap sync ios

      # App Store審査対応(ITMS-90068): Appleは2027年春以降、新規iOSアプリの
      # MinimumOSVersionを15.0以上にすることを必須化すると予告している。
      # sg-weekend-appと同じ汎用スクリプトを流用（詳細はscripts/ensure-min-ios-version.py参照）。
      - name: (App Store審査対応) Ensure minimum iOS version is 15.0 (ITMS-90068)
        run: |
          cd ios-app
          python3 ../scripts/ensure-min-ios-version.py ios

      - name: Re-run pod install after Podfile patch
        run: |
          cd ios-app/ios/App
          pod install

      - name: Set export compliance in Info.plist
        run: |
          cd ios-app
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Set status bar style in Info.plist
        run: |
          cd ios-app
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleDarkContent" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :UIStatusBarStyle UIStatusBarStyleDarkContent" ios/App/App/Info.plist

      # SGBusNaviはGPSで最寄りバス停を自動検出するため、位置情報の利用目的を
      # Info.plistに登録する必要がある（未設定だとApp Store審査でリジェクトされる、
      # また実機でも許可ダイアログ自体が出ない）。sg-weekend-appは位置情報の用途が
      # 「探訪」機能のチェックイン限定でネイティブプラグイン(Capacitor Geolocation)を
      # 使っていないため、この設定は元々不要だった。SGBusNaviはWeb標準の
      # navigator.geolocationをそのままWKWebView上で使う想定のため、キー自体は必要。
      - name: Set location usage description in Info.plist
        run: |
          cd ios-app
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'SGBusNavi uses your location to find the bus stop nearest you.'" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'SGBusNavi uses your location to find the bus stop nearest you.'" ios/App/App/Info.plist

      - name: Select Xcode 26
        run: |
          XCODE=$(ls /Applications/ | grep -E '^Xcode_26' | sort -r | head -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/${XCODE}"
            echo "Selected: $XCODE"
          else
            echo "Xcode 26 not found, using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios-app

      - name: Extract release notes from package.json
        id: notes
        run: |
          NOTES=$(node -p "require('./ios-app/package.json').releaseNotes || 'Bug fixes and performance improvements.'")
          VER=$(node -p "require('./ios-app/package.json').version")
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT
          echo "app_version=${VER}" >> $GITHUB_OUTPUT

      - name: Deploy to App Store
        run: |
          cd ios-app
          bundle exec fastlane deploy
        env:
          ASC_KEY_ID:               ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:            ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY:          ${{ secrets.ASC_PRIVATE_KEY }}
          DIST_CERT_BASE64:         ${{ secrets.DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD:       ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID:            ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER:             ${{ github.run_number }}
          RELEASE_NOTES:            ${{ steps.notes.outputs.release_notes }}
          APP_VERSION:              ${{ steps.notes.outputs.app_version }}
